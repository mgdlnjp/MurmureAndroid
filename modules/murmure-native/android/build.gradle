plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.murmure.core'
version = '0.1.0'

android {
  namespace "app.murmure.core"

  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk {
      abiFilters "arm64-v8a"
    }
    externalNativeBuild {
      cmake {
        // Release même en debug : ggml compilé en Debug est ~10x plus lent.
        arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  lint {
    // Tout appel d'API plus récente que minSdk (26) sans garde SDK_INT fait échouer le lint.
    error 'NewApi'
    abortOnError true
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  // org.json d'Android n'est qu'un stub en tests JVM : vraie implémentation pour les tests.
  testImplementation "org.json:json:20240303"
}
